<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project</title>
</head>
<body>
    <p>Youtube Subscribe Button</p>
    <button class="js-subbutton", onclick="
        Subscribe();
    ">Subscribe</button>
    <p>Amazon Shipping Calculator</p>
    <p>Orders under $40 = +10$ shipping</p>
    <p>Orders over $40 = FREE shipping</p>
    <input placeholder="Cost of order" class = js-costinput onkeydown="
        Enter();
    ">
    <button onclick="
        calculateTotal();
    ">calculate</button>
    <p class="js-costdisplay"></p>
    <script>
        function Subscribe(){
            const buttonElement = document.querySelector('.js-subbutton');
            if (buttonElement.innerHTML === 'Subscribe'){
                buttonElement.innerHTML = 'Subscribed';
            } else {
                buttonElement.innerHTML = 'Subscribe';
            }
        }
        function calculateTotal(){
            const CostElement = document.querySelector('.js-costinput');
            let cost = Number(CostElement.value);
            if(cost < 40){
                cost += 10
            }
            document.querySelector('.js-costdisplay').innerHTML = 'Your final price is $' + cost
        }
        function Enter(){
            if (event.key === 'Enter'){
            calculateTotal();
            }
        }
    </script>
</body>
</html>
